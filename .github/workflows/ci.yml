name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-latest
            cc: gcc
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    env:
      BIFROST_TEST_CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.cc }} --version
      - run: cargo test --no-fail-fast
